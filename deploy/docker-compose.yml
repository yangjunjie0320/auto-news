# 三个服务，两个卷。只有 scraper 是真正常驻工作的进程；
# builder 是个 sleep 循环，nginx 只发静态文件。
#
# scraper 和 builder 必须同一个 UID：atomic_json.py 会把 state 目录 chmod 成
# 0700，UID 不同 builder 读不到 digest。

x-appuser: &appuser "10001:10001"

services:
  # 首次启动时 state 卷是空的，把仓库里的历史 digest 拷进去，
  # 站点第一天就有内容，不必等抓取积累。
  # 幂等：digest 目录已有内容就什么都不做。跑完即退出，属正常状态。
  seed:
    # 复用 scraper 镜像：只用到 sh 和 cp，没必要为此多拉一个外部镜像
    build:
      context: ../scraper
    image: auto-news-scraper
    user: *appuser
    volumes:
      - state:/data/state
      - ../seed:/seed:ro
      - ./seed.sh:/deploy/seed.sh:ro
    command: ["/bin/sh", "/deploy/seed.sh"]

  scraper:
    build:
      context: ../scraper
    image: auto-news-scraper
    restart: always
    user: *appuser
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - state:/data/state
      - logs:/data/logs
      # 权限必须 0600，理由见 README
      - ./config.yaml:/config/config.yaml:ro
    environment:
      # Settings 的路径字段都是相对 CWD 的，这里全部指到挂载卷。
      # 每个字段都支持 AUTO_NEWS_MONITOR_<字段名大写> 覆盖，不用改代码。
      AUTO_NEWS_MONITOR_DIGEST_DIR: /data/state/digest
      AUTO_NEWS_MONITOR_DIGEST_STATE_FILE: /data/state/digest.json
      AUTO_NEWS_MONITOR_DIGEST_OUTBOX_FILE: /data/state/digest_outbox.json
      AUTO_NEWS_MONITOR_STATE_FILE: /data/state/seen.json
      AUTO_NEWS_MONITOR_HEALTH_FILE: /data/state/health.json
      AUTO_NEWS_MONITOR_CARD_STORE_FILE: /data/state/cards.json
      AUTO_NEWS_MONITOR_FORWARDED_FILE: /data/state/forwarded.json
      AUTO_NEWS_MONITOR_LOG_DIR: /data/logs
      # 让 docker logs 能看到；容器里不需要再写一份文件日志之外的东西
      AUTO_NEWS_MONITOR_CONSOLE_LOG: "true"

  builder:
    build:
      context: ../web
    image: auto-news-builder
    restart: always
    user: *appuser
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - state:/data/state:ro
      - www:/data/www
      - ./rebuild.sh:/deploy/rebuild.sh:ro
      - ./rebuild-loop.sh:/deploy/rebuild-loop.sh:ro
    environment:
      DIGEST_DIR: /data/state/digest
      WWW_DIR: /data/www
      APP_DIR: /app
      REBUILD_INTERVAL_SECONDS: "3600"
      # RSS 自引用链接用，上线前改成真实域名
      SITE_BASE_URL: "${SITE_BASE_URL:-https://autohot.example}"
    command: ["/bin/sh", "/deploy/rebuild-loop.sh"]

  # Caddy 同时做 TLS 终止和静态文件服务，不需要在它后面再放一层 nginx。
  # SITE_ADDRESS 填真实域名时自动申请并续期 Let's Encrypt 证书。
  # state 里的 digest 是不可再生的历史数据，全量快照到宿主机的 ./backups/。
  # 数据是纯文本且只追加，压完极小，所以不做增量。
  backup:
    build:
      context: ../scraper
    image: auto-news-scraper
    restart: always
    user: *appuser
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - state:/data/state:ro
      - ./backups:/backups
      - ./backup.sh:/deploy/backup.sh:ro
      - ./backup-loop.sh:/deploy/backup-loop.sh:ro
    environment:
      STATE_DIR: /data/state
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_KEEP: "30"
    command: ["/bin/sh", "/deploy/backup-loop.sh"]

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - builder
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # 必须在这里给默认值：Caddy 的 {$VAR:default} 在变量「设了但为空」时
      # 不会回落到默认值，会让 Caddyfile 行首剩一个 { 被当成全局配置块。
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - www:/srv/www:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书和 ACME 账号必须持久化，否则每次重启都重新签发，
      # 很快会撞上 Let's Encrypt 的速率限制
      - caddy_data:/data
      - caddy_config:/config

volumes:
  state:
  logs:
  www:
  caddy_data:
  caddy_config:
