server {
    listen 80;
    server_name _;

    # current 是指向 releases/<时间戳>/ 的软链，rebuild.sh 原子切换它。
    # nginx 每次请求都会重新解析路径，换链不需要 reload。
    root /srv/www/current;
    index index.html;

    charset utf-8;

    # 静态导出的路由是 daily.html 而不是 daily/index.html，没有 $uri.html
    # 这条，访问 /daily 会直接 404。
    #
    # 结尾必须是 =404 而不是 /404.html：直接回落到 /404.html 会以 200 状态
    # 把错误页发出去，爬虫和阅读器会把它当成正常页面。=404 交给下面的
    # error_page 接管，才会带真正的 404 状态码。
    #
    # no-cache 必须加在这里而不是只加在 location ~ \.html$ 上：location 匹配
    # 发生在 try_files 改写路径之前，请求 / 时 URI 还不是 /index.html，
    # 正则块根本匹配不到，页面就会带着默认缓存发出去。
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 文件名带内容 hash，可以永久缓存。
    # 不要再叠一个 expires 1y：它自己会发一条 Cache-Control，和下面这条并存
    # 会让响应里出现两个 Cache-Control 头。
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 直接请求 /about.html 这类带后缀的路径时同样不缓存
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    # feed 更新频率和数据一致，给个短缓存
    location ~ ^/rss(\.zh)?\.xml$ {
        types { } default_type "application/rss+xml; charset=utf-8";
        add_header Cache-Control "public, max-age=900";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/rss+xml image/svg+xml;
    gzip_min_length 1024;
}
