# 部署用配置模板。复制成 deploy/config.yaml 填真实值，权限必须 0600（理由见 README）。
#
# 容器里的路径由 docker-compose.yml 用 AUTO_NEWS_MONITOR_* 环境变量指到挂载卷，
# 所以这里不需要写任何路径。
#
# 注意 Settings 是 extra="forbid"：多一个拼错的键是硬错误，不是警告。

# 唯一必需的密钥。分类没跑等于产出空标签，--self-check 会挡住缺 key 的情况。
classification_enabled: true
deepseek_api_key: ""

# 中译英，供英文站与英文 RSS 使用。失败只降级成没有英文。
translate_enabled: true

# 轮询节奏
poll_interval_seconds: 3600
max_new_pushes_per_cycle: 25
max_article_age_hours: 72

# 抓取节流。境外服务器如果遇到限流，把延迟调大。
source_delay_min_seconds: 1.0
source_delay_max_seconds: 3.0
request_timeout: 20.0
request_retries: 3

log_level: INFO
