# 部署用配置模板。复制成 deploy/config.yaml 填真实值，权限必须 0600（理由见 README）。
#
# 这是「只供网站、不推飞书」的配置。字段比 scraper/config.example.yaml 少很多，
# 因为关掉飞书后 app_id / app_secret / chat_id / 转发 / 多维表格全都不需要了。
#
# 注意 Settings 是 extra="forbid"：多一个拼错的键是硬错误，不是警告。

# 关掉飞书：不建飞书客户端、不推卡片、不跑转发与 08:00 日报调度。
# 链路只剩「轮询 -> 分类翻译 -> 写 digest jsonl」。
feishu_enabled: false

# 把每条文章落进 state/digest/*.jsonl。这是网站的全部输入，必须开。
digest_archive_enabled: true

# 唯一必需的密钥。关飞书后网站是唯一出口，分类没跑等于产出空标签，
# --self-check 会挡住缺 key 的情况。
classification_enabled: true
deepseek_api_key: ""

# 中译英，结果写进 digest 的 title_en/summary_en，供英文站与英文 RSS 使用。
# 失败只降级成没有英文，中文字段和中文 RSS 不受影响。
translate_enabled: true

# 轮询节奏
poll_interval_seconds: 3600
max_new_pushes_per_cycle: 25
max_article_age_hours: 72

# 抓取节流。境外服务器如果遇到限流，把延迟调大。
source_delay_min_seconds: 1.0
source_delay_max_seconds: 3.0
request_timeout: 20.0
request_retries: 3

log_level: INFO
