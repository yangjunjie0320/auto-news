# auto-news 抓取端配置模板。复制为 config.yaml 并填入真实值（config.yaml 不入 git）。
# 所有键支持 AUTO_NEWS_MONITOR_ 前缀的环境变量覆盖。
#
# 注意 Settings 是 extra="forbid"：多一个拼错的键是硬错误，不是警告。

sources_file: "sources.yaml"
state_file: "state/seen.json"
health_file: "state/health.json"

# 归档目录。每条文章落成 state/digest/YYYY-MM-DD.jsonl，
# 这是网站与 RSS 的全部输入，也是本项目唯一的产出。
digest_dir: "state/digest"

# 轮询节奏
poll_interval_seconds: 3600           # 每小时一轮
max_new_pushes_per_cycle: 25          # 单源一轮最多处理的新条目数
seen_mids_per_account: 300
max_article_age_hours: 72             # 精确发布时间的文章超过 72h 不再补录

# 抓取节流。境外服务器如果遇到限流，把延迟调大。
source_delay_min_seconds: 1.0
source_delay_max_seconds: 3.0
request_timeout: 20.0
request_retries: 3

# DeepSeek 分类（车圈热点/产品发布/谍照申报/市场数据/资本市场/
# 出海信息/政策监管/行业观察/广告/汽车无关）。
# 广告、汽车无关和非中国内容默认丢弃，不进归档。
classification_enabled: true
deepseek_api_key: ""

# 中译英，结果写进归档的 title_en/summary_en，供英文站与英文 RSS 使用。
# 分类之后单独调一次。失败只降级成没有英文，中文字段和中文 RSS 不受影响。
translate_enabled: true

# 微博抓取。启用哪些源在 sources.yaml，这里只配参数。
# 访客 cookie 抓太勤会被限流，sources.yaml 给微博源配了 interval_seconds: 86400。
weibo_pool_file: "pool.yaml"        # 人工筛选的博主清单
# 关键词搜索默认关闭（sources.yaml 里 weibo-search 的 enabled: false）。
# 要开的话关键词必须是专有名词：泛词搜回来基本是广告和科普。
weibo_search_queries: []            # 例：["腾势Z9S", "小米YU7"]
weibo_min_engagement: 5             # 与粉丝量是「或」关系，刚官宣的事件互动常为 0
weibo_min_followers: 100000

log_level: INFO
log_dir: logs
